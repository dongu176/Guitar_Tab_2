name: Selftest (synthetic videos, no Gemini)

on:
  push:
    paths: ["*.py", "tests/**", "requirements.txt", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-nanum fonts-dejavu-core
          pip install -r requirements.txt
      - name: Run selftest (jsonschema validation is mandatory here)
        run: python tests/selftest.py --require-jsonschema
